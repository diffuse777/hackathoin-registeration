<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Hackathon · Status</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    <header class="topbar">
      <div class="topbar-left">
        <a class="logo-btn" href="/home" aria-label="Cybernerds home">
          <img class="logo logo-cybernerds" src="/images/cybernerds.png" alt="Cybernerds KARE Student Chapter" />
        </a>
        <img class="logo logo-owasp" src="/images/owasp.png" alt="OWASP KARE Student Chapter" />
      </div>
      <div class="topbar-right">
        <img class="logo logo-kare" src="/images/kare.png" alt="Kalasalingam Academy of Research and Education" />
        <a class="btn btn-primary header-register" href="/register">Register</a>
      </div>
    </header>

    <main>
      <p class="kicker" id="done-kicker">Payment confirmed</p>
      <h2 id="done-title">You’re in.</h2>
      <p id="done-body" class="lede"></p>
      <a class="btn btn-primary" href="/home">Back to home</a>
    </main>
    <script src="/js/done.js"></script>
  </body>
</html>
